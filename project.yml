name: Canto
options:
  bundleIdPrefix: com.infinitelabs
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  Canto:
    type: application
    platform: macOS
    sources:
      - path: Canto
    info:
      path: Canto/Info.plist
      properties:
        LSApplicationCategoryType: "public.app-category.developer-tools"
        CFBundleDisplayName: "Canto"
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Markdown Document"
            CFBundleTypeExtensions:
              - "md"
              - "markdown"
            LSHandlerRank: "Alternate"
            LSItemContentTypes:
              - "net.daringfireball.markdown"
              - "public.plain-text"
        NSHumanReadableCopyright: "Copyright © 2026 Infinite Labs OÜ. All rights reserved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infinitelabs.canto
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: Canto/Canto.entitlements
        INFOPLIST_FILE: Canto/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"

  CantoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CantoTests
    dependencies:
      - target: Canto
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.infinitelabs.canto.tests
