name: Canto
options:
  bundleIdPrefix: com.infinitelabs
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  Canto:
    type: application
    platform: macOS
    sources:
      - path: Canto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infinitelabs.canto
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: Canto/Canto.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_CFBundleDisplayName: Canto
    entitlements:
      path: Canto/Canto.entitlements

  CantoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CantoTests
    dependencies:
      - target: Canto
    settings:
      base:
        SWIFT_VERSION: "6.0"
