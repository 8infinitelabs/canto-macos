<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle off-white background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFEAFB"/>
    </linearGradient>

    <!-- Primary violet for the C bars -->
    <linearGradient id="cBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Lighter violet for inner lines -->
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>

    <linearGradient id="lineSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>

    <!-- Soft drop shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#5B21B6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#bg)"/>

  <!-- Subtle border for definition -->
  <rect x="2" y="2" width="1020" height="1020" rx="224" ry="224"
        fill="none" stroke="#000" stroke-opacity="0.04" stroke-width="3"/>

  <!-- C — built from 3 markdown-style bars -->
  <g filter="url(#softShadow)">
    <!-- Top arm of C -->
    <rect x="240" y="240" width="544" height="72" rx="36" fill="url(#cBar)"/>
    <!-- Left vertical of C -->
    <rect x="240" y="240" width="72" height="544" rx="36" fill="url(#cBar)"/>
    <!-- Bottom arm of C -->
    <rect x="240" y="712" width="544" height="72" rx="36" fill="url(#cBar)"/>
  </g>

  <!-- Markdown content lines inside the C -->
  <!-- Line 1: heading style (slightly thicker, full opacity) -->
  <rect x="392" y="408" width="320" height="28" rx="14" fill="url(#line)"/>
  <!-- Line 2: paragraph (longer, softer) -->
  <rect x="392" y="466" width="392" height="22" rx="11" fill="url(#lineSoft)" opacity="0.85"/>
  <!-- Line 3: paragraph (medium) -->
  <rect x="392" y="514" width="312" height="22" rx="11" fill="url(#lineSoft)" opacity="0.85"/>
  <!-- Line 4: list bullet + line -->
  <circle cx="404" cy="572" r="9" fill="url(#lineSoft)" opacity="0.7"/>
  <rect x="430" y="561" width="220" height="22" rx="11" fill="url(#lineSoft)" opacity="0.7"/>
</svg>
